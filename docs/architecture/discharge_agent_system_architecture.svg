<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Discharge summary agent — full system architecture</title>
<desc>System architecture in four layers. Top: a patient PDF folder of image-only scans (typed and handwritten, no text layer). Ingestion layer: pdfplumber renders every page to a PNG, then gpt-4.1-mini vision-OCRs every page (disk-cached) — there is no typed-vs-handwritten routing. Agent core (dashed container): row one has the gpt-5-mini brain/planner, the AgentState data store of 12 cited fields, and the Tool Registry; row two has the from-scratch ReAct engine (think/act/observe), the no-fabrication guardrail validate_and_set(), and the step cap plus trace logging; below them six callable tool boxes: parse_doc, extract_field, validate_set, reconcile, drug_interaction, flag_review. Output layer: discharge_summary.md (the structured draft for review) and trace.json (the step-by-step log). Arrows show the bidirectional brain-to-ReAct flow, the guardrail writing to AgentState, ReAct reading AgentState, ReAct calling tools, and tools routing writes back through the guardrail.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  svg { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .title { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .sub   { font-size: 12px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .tool  { font-size: 10px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .layer { font-size: 12px; font-weight: 400; text-anchor: start; fill: rgb(194,192,182); }
  .container { fill: rgb(38,38,36); }
  .arrow { fill: none; stroke: rgb(156,154,146); stroke-width: 1.5px; }
  .arrow-soft { fill: none; stroke: rgba(222,220,209,0.3); stroke-width: 1px; }

  .box-grey   { fill: rgb(68,68,65);  stroke: rgb(180,178,169); stroke-width: 0.5px; }
  .box-green  { fill: rgb(8,80,65);   stroke: rgb(93,202,165);  stroke-width: 0.5px; }
  .box-blue   { fill: rgb(12,68,124); stroke: rgb(133,183,235); stroke-width: 0.5px; }
  .box-purple { fill: rgb(60,52,137); stroke: rgb(175,169,236); stroke-width: 0.5px; }
  .box-orange { fill: rgb(99,56,6);   stroke: rgb(239,159,39);  stroke-width: 0.5px; }
  .box-red    { fill: rgb(113,43,19); stroke: rgb(240,153,123); stroke-width: 0.5px; }

  .ti-grey   { fill: rgb(211,209,199); } .su-grey   { fill: rgb(180,178,169); }
  .ti-green  { fill: rgb(159,225,203); } .su-green  { fill: rgb(93,202,165); }
  .ti-blue   { fill: rgb(181,212,244); } .su-blue   { fill: rgb(133,183,235); }
  .ti-purple { fill: rgb(206,203,246); } .su-purple { fill: rgb(175,169,236); }
  .ti-orange { fill: rgb(250,199,117); } .su-orange { fill: rgb(239,159,39); }
  .ti-red    { fill: rgb(245,196,179); } .su-red    { fill: rgb(240,153,123); }
</style>
</defs>

<!-- ============ INPUT ============ -->
<g onclick="sendPrompt('What patient PDFs does the discharge summary agent receive, and why are they image-only?')">
  <rect x="40" y="20" width="600" height="44" rx="8" class="box-grey"/>
  <text x="340" y="35" class="title ti-grey">Patient PDF folder</text>
  <text x="340" y="53" class="sub su-grey">image-only scans · typed + handwritten · no text layer</text>
</g>
<line x1="340" y1="64" x2="340" y2="80" class="arrow" marker-end="url(#arrow)"/>

<!-- ============ INGESTION (render -> OCR every page) ============ -->
<rect x="40" y="80" width="600" height="62" rx="10" class="container" stroke="rgba(222,220,209,0.15)" stroke-width="0.5"/>
<text x="55" y="76" class="layer">ingestion · OCR every page (no typed/handwritten routing)</text>
<g onclick="sendPrompt('How is pdfplumber used only as a renderer (page to PNG), not as a text extractor?')">
  <rect x="55" y="90" width="252" height="42" rx="6" class="box-green"/>
  <text x="181" y="104" class="title ti-green">pdfplumber</text>
  <text x="181" y="120" class="sub su-green">render every page → PNG (cached)</text>
</g>
<line x1="307" y1="111" x2="358" y2="111" class="arrow" marker-end="url(#arrow)"/>
<g onclick="sendPrompt('How does gpt-4.1-mini OCR every page, and how is the result cached and repetition-guarded?')">
  <rect x="358" y="90" width="267" height="42" rx="6" class="box-blue"/>
  <text x="491" y="104" class="title ti-blue">gpt-4.1-mini · vision OCR</text>
  <text x="491" y="120" class="sub su-blue">every page · cached by image hash</text>
</g>
<line x1="340" y1="142" x2="340" y2="158" class="arrow" marker-end="url(#arrow)"/>

<!-- ============ AGENT CORE ============ -->
<rect x="40" y="158" width="600" height="230" rx="14" class="container" stroke="rgba(222,220,209,0.3)" stroke-width="0.5" stroke-dasharray="6 3"/>
<text x="55" y="175" class="layer">agent core</text>

<!-- row 1 -->
<g onclick="sendPrompt('How does gpt-5-mini act as the agent brain/planner via OpenAI function calling?')">
  <rect x="55" y="183" width="162" height="55" rx="8" class="box-blue"/>
  <text x="136" y="201" class="title ti-blue">gpt-5-mini</text>
  <text x="136" y="221" class="sub su-blue">agent brain · planner</text>
</g>
<g onclick="sendPrompt('Show me the AgentState dataclass with all 12 required fields and their citations')">
  <rect x="232" y="183" width="192" height="55" rx="8" class="box-purple"/>
  <text x="328" y="201" class="title ti-purple">AgentState</text>
  <text x="328" y="221" class="sub su-purple">12 fields · status · citations</text>
</g>
<g onclick="sendPrompt('List all 6 tools in the tool registry with their signatures and the shared failure contract')">
  <rect x="442" y="183" width="173" height="55" rx="8" class="box-red"/>
  <text x="528" y="201" class="title ti-red">Tool Registry</text>
  <text x="528" y="221" class="sub su-red">6 tools · retry → report</text>
</g>

<!-- row 2 -->
<g onclick="sendPrompt('Show me the from-scratch ReAct loop — think/act/observe with the step cap and re-plan edge')">
  <rect x="55" y="255" width="162" height="55" rx="8" class="box-green"/>
  <text x="136" y="273" class="title ti-green">ReAct Engine</text>
  <text x="136" y="293" class="sub su-green">Think · Act · Observe</text>
</g>
<g onclick="sendPrompt('Show me validate_and_set() — the no-fabrication guardrail and only field write path')">
  <rect x="232" y="255" width="192" height="55" rx="8" class="box-orange"/>
  <text x="328" y="273" class="title ti-orange">No-fab guardrail</text>
  <text x="328" y="293" class="sub su-orange">validate_and_set()</text>
</g>
<g onclick="sendPrompt('How are the step cap and the step-by-step trace log enforced?')">
  <rect x="442" y="255" width="173" height="55" rx="8" class="box-grey"/>
  <text x="528" y="273" class="title ti-grey">Cap &amp; logging</text>
  <text x="528" y="293" class="sub su-grey">MAX=25 · trace.json</text>
</g>

<!-- tools row (6) -->
<g onclick="sendPrompt('Show me the parse_doc tool implementation in full')">
  <rect x="55" y="327" width="86" height="36" rx="6" class="box-grey"/>
  <text x="98" y="345" class="tool su-grey">parse_doc</text>
</g>
<g onclick="sendPrompt('Show me the extract_field tool implementation in full')">
  <rect x="149" y="327" width="86" height="36" rx="6" class="box-grey"/>
  <text x="192" y="345" class="tool su-grey">extract_field</text>
</g>
<g onclick="sendPrompt('Show me the validate_set tool (guardrail write path) implementation in full')">
  <rect x="243" y="327" width="86" height="36" rx="6" class="box-orange"/>
  <text x="286" y="345" class="tool su-orange">validate_set</text>
</g>
<g onclick="sendPrompt('Show me the reconcile tool for medication reconciliation in full')">
  <rect x="337" y="327" width="86" height="36" rx="6" class="box-grey"/>
  <text x="380" y="345" class="tool su-grey">reconcile</text>
</g>
<g onclick="sendPrompt('Show me the mock drug_interaction tool and its brand→generic mapping')">
  <rect x="431" y="327" width="86" height="36" rx="6" class="box-grey"/>
  <text x="474" y="345" class="tool su-grey">drug_interaction</text>
</g>
<g onclick="sendPrompt('Show me the flag_review escalation tool implementation in full')">
  <rect x="525" y="327" width="86" height="36" rx="6" class="box-red"/>
  <text x="568" y="345" class="tool su-red">flag_review</text>
</g>

<!-- internal wiring -->
<line x1="128" y1="238" x2="128" y2="255" class="arrow" marker-end="url(#arrow)"/>
<line x1="144" y1="255" x2="144" y2="238" class="arrow" marker-end="url(#arrow)"/>
<line x1="320" y1="255" x2="320" y2="238" class="arrow" marker-end="url(#arrow)"/>
<path d="M217 282 L225 282 L225 210 L232 210" class="arrow-soft" marker-end="url(#arrow)"/>
<line x1="136" y1="310" x2="136" y2="327" class="arrow" marker-end="url(#arrow)"/>
<line x1="286" y1="327" x2="286" y2="310" class="arrow" marker-end="url(#arrow)"/>

<line x1="340" y1="388" x2="340" y2="404" class="arrow" marker-end="url(#arrow)"/>

<!-- ============ OUTPUTS ============ -->
<g onclick="sendPrompt('Show me how discharge_summary.md is rendered from agent_state.json with the flags/conflicts/pending banner')">
  <rect x="40" y="404" width="290" height="56" rx="8" class="box-green"/>
  <text x="185" y="423" class="title ti-green">discharge_summary.md</text>
  <text x="185" y="443" class="sub su-green">structured draft for review</text>
</g>
<g onclick="sendPrompt('Show me what trace.json looks like — one complete step entry (reasoning → tool → result)')">
  <rect x="350" y="404" width="290" height="56" rx="8" class="box-grey"/>
  <text x="495" y="423" class="title ti-grey">trace.json</text>
  <text x="495" y="443" class="sub su-grey">step-by-step agent log</text>
</g>

</svg>
